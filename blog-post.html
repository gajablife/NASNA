    @media (max-width:880px){

<body data-page="blog">
  <div id="siteHeader"></div>

  <div class="blog-detail-container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to NASNA Home</a>
    <div id="blogDetailContent">
      <div style="text-align:center; padding:60px;"><i class="fas fa-spinner fa-pulse"></i> Loading NASNA honey stories...</div>
    </div>
  </div>
  <div id="siteFooter"></div>
  <script src="/includes.js"></script>
  <script>
    // NASNA Blog Database - full articles for details page
    const postsDB = [
      { 
        id: 1, 
        slug: "urban-beekeeping-with-nasna",
        category: "BEEKEEPING", 
        title: "How to Start Urban Beekeeping with NASNA", 
        metaDescription: "Learn practical urban beekeeping tips from NASNA, from equipment and mentorship to water sources and pollinator-friendly plants.",
        fullContent: "Urban beekeeping is on the rise. With the right equipment — a flow hive or traditional Langstroth — and a small balcony or rooftop, anyone can become a beekeeper. NASNA recommends starting with a mentor, checking local regulations, providing a water source, and planting pollinator-friendly flowers. Start small, join a local beekeeping club, and soon you'll be harvesting your own liquid gold! At NASNA, we offer starter kits and guidance for aspiring beekeepers. Our mission is to bring back the bees to every neighborhood.",
        img: "https://placehold.co/800x450/FFE5C4/AC744B?text=NASNA+Beekeeping+Tips"
      },
      { 
        id: 2, 
        slug: "honey-infused-meals-by-nasna",
        category: "RECIPES", 
        title: "5 Wholesome Honey-Infused Meals by NASNA", 
        metaDescription: "Explore five honey-infused meal ideas using NASNA raw honey, with simple wellness benefits for energy, digestion, and daily nourishment.",
        intro: "Honey can bring natural sweetness, balance, and nourishment to everyday meals. With NASNA raw honey, simple food becomes more flavourful and more mindful.",
        points: [
          {
            title: "1. Honey Oats Porridge",
            text: "A warm bowl of oats topped with fruits, nuts, and a gentle drizzle of NASNA honey gives slow energy, supports digestion, and keeps breakfast light yet filling."
          },
          {
            title: "2. Honey Yogurt Fruit Bowl",
            text: "Curd, seasonal fruits, seeds, and raw honey make a refreshing snack that supports gut health, adds natural antioxidants, and satisfies sweet cravings without heaviness."
          },
          {
            title: "3. Honey Lemon Sprout Salad",
            text: "Sprouts, cucumber, lemon, herbs, and honey create a fresh bowl rich in plant protein, fiber, and immunity-supporting nutrients."
          },
          {
            title: "4. Honey Glazed Carrots and Sweet Potatoes",
            text: "A comforting plate with natural sweetness, beta-carotene, minerals, and clean energy. It works beautifully as a light meal or nourishing side."
          },
          {
            title: "5. Honey Turmeric Milk",
            text: "Warm milk with turmeric and honey is a soothing evening drink that supports recovery, throat comfort, and restful sleep."
          }
        ],
        conclusion: "Every spoon of NASNA raw honey adds more than sweetness. It brings a small daily step toward better health, better taste, and better choices.",
        img: "https://placehold.co/800x450/F5DDAA/B97F42?text=NASNA+Honey+Recipes"
      },
      { 
        id: 3, 
        slug: "raw-honey-vs-processed",
        category: "WELLNESS", 
        title: "Raw Honey vs Processed: NASNA's Guide", 
        metaDescription: "Understand the difference between raw honey and processed honey, and why NASNA raw honey keeps natural enzymes and antioxidants intact.",
        fullContent: "Raw honey contains natural enzymes, pollen, and compounds like hydrogen peroxide that aid digestion and support immunity. Processed honey is often heated and filtered, destroying beneficial nutrients. While both are sweet, raw honey offers anti-inflammatory properties and can soothe sore throats. Choose NASNA raw, local honey for the ultimate wellness boost. Our unfiltered honey retains all the goodness nature intended. Experience the NASNA difference — pure, potent, and packed with health benefits.",
        img: "https://placehold.co/800x450/EED6B0/996F45?text=NASNA+Health+Tips"
      }
    ];
    
    const urlParams = new URLSearchParams(window.location.search);
    const postId = parseInt(urlParams.get('id'));
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = pathParts.length ? pathParts[pathParts.length - 1].replace('.html', '') : '';
    const post = postsDB.find(p => p.id === postId || p.slug === slug);
    const container = document.getElementById('blogDetailContent');

    function upsertMeta(selector, createTag, attributes) {
      let element = document.head.querySelector(selector);
      if (!element) {
        element = document.createElement(createTag);
        document.head.appendChild(element);
      }
      Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
    }

    function applyPostSeo(post) {
      const canonicalUrl = `https://nasna.in/blog/${post.slug}`;
      document.title = `${post.title} | NASNA Pure Honey Stories`;
      upsertMeta('meta[name="description"]', 'meta', { name: 'description', content: post.metaDescription });
      upsertMeta('link[rel="canonical"]', 'link', { rel: 'canonical', href: canonicalUrl });
      upsertMeta('meta[property="og:title"]', 'meta', { property: 'og:title', content: post.title });
      upsertMeta('meta[property="og:description"]', 'meta', { property: 'og:description', content: post.metaDescription });
      upsertMeta('meta[property="og:url"]', 'meta', { property: 'og:url', content: canonicalUrl });
      upsertMeta('meta[property="og:image"]', 'meta', { property: 'og:image', content: post.img });
      upsertMeta('meta[name="twitter:title"]', 'meta', { name: 'twitter:title', content: post.title });
      upsertMeta('meta[name="twitter:description"]', 'meta', { name: 'twitter:description', content: post.metaDescription });
      upsertMeta('meta[name="twitter:image"]', 'meta', { name: 'twitter:image', content: post.img });

      const articleSchema = document.createElement('script');
      articleSchema.type = 'application/ld+json';
      articleSchema.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'Article',
        headline: post.title,
        description: post.metaDescription,
        image: post.img,
        url: canonicalUrl,
        author: { '@type': 'Organization', name: 'NASNA Enterprises' },
        publisher: {
          '@type': 'Organization',
          name: 'NASNA Enterprises',
          logo: { '@type': 'ImageObject', url: 'https://nasna.in/images/logo600x600.png' }
        }
      });
      document.head.appendChild(articleSchema);
    }
    
    if(post) {
      applyPostSeo(post);
      const articleBody = post.points ? `
          <p>${post.intro}</p>
          <div class="article-points">
            ${post.points.map(point => `
              <div class="article-point">
                <h3>${point.title}</h3>
                <p>${point.text}</p>
              </div>
            `).join('')}
          </div>
          <p>${post.conclusion}</p>
        ` : `<p>${post.fullContent}</p>`;

      container.innerHTML = `
        <img src="${post.img}" alt="${post.title}" class="article-img">
        <div class="blog-category">${post.category}</div>
        <h1>${post.title}</h1>
        <div class="article-content">
          ${articleBody}
          <p>At NASNA, we believe in sharing authentic knowledge. This article reflects our passion for pure honey and sustainable apiculture. We hope you enjoyed this read — and remember to always choose raw, ethically sourced honey for both flavor and wellness.</p>
          <p style="margin-top:30px; font-style:italic;"><i class="fas fa-jar"></i> — The NASNA Honey Team</p>
          <p style="margin-top:20px;"><a href="/index.html" style="color:#d48f2b; font-weight:600;">← Explore more NASNA products</a></p>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div style="text-align:center; padding:60px;">
          <h2>Oops! 🍯</h2>
          <p>This honey story seems to be missing. Go back to the <a href="/index.html" style="color:#d48f2b;">NASNA homepage</a>.</p>
        </div>
      `;
    }
  </script>
</body>
